<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hangman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: gallows drawing on the left, word + keyboard on the right; stacks to one column on phones. */
  :root {
    --bg: #e8edf3;
    --surface: #f7f9fb;
    --ink: #14233a;
    --muted: #586a80;
    --line: #c3cfdc;
    --accent: #1f5eff;
    --accent-ink: #ffffff;
    --bad: #d3352a;
    --good: #17875a;
    --font-display: "Syne", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1420;
      --surface: #152033;
      --ink: #e6edf7;
      --muted: #91a0b6;
      --line: #27364d;
      --accent: #6f9cff;
      --accent-ink: #0d1420;
      --bad: #ff6f62;
      --good: #4fcb93;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1420;
    --surface: #152033;
    --ink: #e6edf7;
    --muted: #91a0b6;
    --line: #27364d;
    --accent: #6f9cff;
    --accent-ink: #0d1420;
    --bad: #ff6f62;
    --good: #4fcb93;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 28px 40px;
  }
  .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 0;
    text-wrap: balance;
  }
  .stats { display: flex; gap: 20px; margin: 0; padding: 0; list-style: none; }
  .stats li { display: flex; flex-direction: column; align-items: flex-start; }
  .stats .n { font-family: var(--font-mono); font-weight: 800; font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats .l { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cats button {
    font: inherit; font-size: 0.9rem; font-weight: 500;
    padding: 7px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer;
  }
  .cats button:hover { border-color: var(--accent); }
  .cats button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .board { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: stretch; }
  .panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }

  .gallows { display: flex; flex-direction: column; gap: 14px; justify-content: space-between; }
  .gallows svg { width: 100%; height: auto; max-height: 340px; display: block; }
  .gallows .frame { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; fill: none; transition: stroke 0.3s; }
  .gallows .part { stroke: var(--bad); stroke-width: 6; stroke-linecap: round; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 0.45s ease; }
  .gallows .part.on { stroke-dashoffset: 0; }
  .gallows.saved .part, .gallows.saved .frame { stroke: var(--good); }
  .lives { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); transition: background 0.3s, transform 0.3s; }
  .pip.lost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); transform: scale(0.8); }
  .lives-text { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .play { display: flex; flex-direction: column; gap: 22px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .word { display: flex; flex-wrap: wrap; gap: 8px 6px; min-height: 64px; align-items: end; }
  .slot {
    width: clamp(26px, 7.4vw, 44px); height: clamp(40px, 10vw, 56px);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 4px solid var(--ink);
    font-family: var(--font-mono); font-weight: 800; font-size: clamp(1.4rem, 5.4vw, 2rem);
    text-transform: uppercase;
  }
  .slot.miss { color: var(--bad); border-color: var(--bad); }
  .slot.win { color: var(--good); border-color: var(--good); }

  .status { min-height: 1.5em; margin: 0; font-size: 0.95rem; color: var(--muted); }

  .keys { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .row { display: flex; gap: 6px; justify-content: center; width: 100%; }
  .key {
    font-family: var(--font-mono); font-weight: 800; font-size: 1rem; text-transform: uppercase;
    flex: 1 1 0; max-width: 46px; min-width: 0; height: 46px; padding: 0;
    border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
    cursor: pointer;
  }
  .key:hover:not(:disabled) { border-color: var(--accent); }
  .key:disabled { cursor: default; }
  .key.ok { background: var(--good); border-color: var(--good); color: var(--bg); }
  .key.no { background: transparent; border-color: var(--line); color: var(--muted); text-decoration: line-through; opacity: 0.6; }
  .key.off { opacity: 0.45; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn {
    font: inherit; font-weight: 700; font-size: 0.95rem;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .result { border-radius: 10px; padding: 14px 16px; border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .result.win { border-color: var(--good); }
  .result.lose { border-color: var(--bad); }
  .result strong { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: -0.01em; }
  .result p { margin: 0; color: var(--muted); }

  .hint { margin: 0; font-size: 0.82rem; color: var(--muted); }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 720px) {
    .board { grid-template-columns: minmax(0, 1fr); }
    .gallows svg { max-height: 240px; }
    .panel { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Hangman</h1>
    <ul class="stats" aria-label="Your record">
      <li><span class="n" id="s-wins">0</span><span class="l">Wins</span></li>
      <li><span class="n" id="s-losses">0</span><span class="l">Losses</span></li>
      <li><span class="n" id="s-streak">0</span><span class="l">Streak</span></li>
      <li><span class="n" id="s-best">0</span><span class="l">Best</span></li>
    </ul>
  </header>

  <div class="cats" id="cats" role="group" aria-label="Word category"></div>

  <main class="board">
    <section class="panel gallows" id="gallows" aria-label="Gallows">
      <svg viewBox="0 0 240 280" role="img" aria-label="Hangman drawing" id="drawing">
        <g class="frame">
          <line x1="20" y1="262" x2="170" y2="262" />
          <line x1="64" y1="262" x2="64" y2="26" />
          <line x1="64" y1="26" x2="164" y2="26" />
          <line x1="64" y1="72" x2="110" y2="26" />
          <line x1="164" y1="26" x2="164" y2="66" />
        </g>
        <circle class="part" cx="164" cy="88" r="22" pathLength="1" />
        <line class="part" x1="164" y1="110" x2="164" y2="182" pathLength="1" />
        <line class="part" x1="164" y1="126" x2="134" y2="160" pathLength="1" />
        <line class="part" x1="164" y1="126" x2="194" y2="160" pathLength="1" />
        <line class="part" x1="164" y1="182" x2="138" y2="228" pathLength="1" />
        <line class="part" x1="164" y1="182" x2="190" y2="228" pathLength="1" />
      </svg>
      <div class="lives">
        <div class="pips" id="pips" aria-hidden="true"></div>
        <span class="lives-text" id="lives-text"></span>
      </div>
    </section>

    <section class="panel play">
      <div class="meta"><span id="meta-cat"></span><span id="meta-len"></span></div>
      <div class="word" id="word" aria-label="Word to guess"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="result" id="result" hidden></div>
      <div class="keys" id="keys"></div>
      <div class="actions">
        <button class="btn" id="hint-btn" type="button">Hint (costs 1 life)</button>
        <button class="btn primary" id="new-btn" type="button">New word</button>
      </div>
      <p class="hint">Tip: you can also type letters on your keyboard.</p>
    </section>
  </main>
</div>

<script>
(function () {
  var MAX_LIVES = 6;
  var WORDS = {
    animals: ['elephant','giraffe','penguin','dolphin','kangaroo','crocodile','butterfly','octopus','squirrel','flamingo','hedgehog','leopard','chameleon','porcupine','cheetah','jellyfish','woodpecker','armadillo'],
    countries: ['argentina','colombia','australia','portugal','indonesia','switzerland','morocco','thailand','norway','vietnam','ecuador','finland','jamaica','nigeria','mongolia','bulgaria'],
    food: ['spaghetti','pancake','avocado','broccoli','croissant','dumpling','burrito','pineapple','chocolate','sandwich','lasagna','mushroom','pretzel','blueberry','guacamole','cinnamon'],
    space: ['galaxy','asteroid','telescope','comet','astronaut','nebula','satellite','eclipse','meteor','orbit','gravity','supernova','saturn','rocket','constellation','universe'],
    tech: ['keyboard','internet','algorithm','browser','database','software','firewall','bandwidth','compiler','password','network','pixel','laptop','server','encryption','javascript']
  };
  var LABELS = { mixed: 'Mixed', animals: 'Animals', countries: 'Countries', food: 'Food', space: 'Space', tech: 'Tech' };
  var ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    cats: $('cats'), word: $('word'), keys: $('keys'), status: $('status'), result: $('result'),
    pips: $('pips'), livesText: $('lives-text'), gallows: $('gallows'), drawing: $('drawing'),
    metaCat: $('meta-cat'), metaLen: $('meta-len'), hintBtn: $('hint-btn'), newBtn: $('new-btn'),
    wins: $('s-wins'), losses: $('s-losses'), streak: $('s-streak'), best: $('s-best')
  };
  var parts = el.drawing.querySelectorAll('.part');

  var stats = { wins: 0, losses: 0, streak: 0, best: 0 };
  try {
    var saved = JSON.parse(localStorage.getItem('hangman-stats') || 'null');
    if (saved && typeof saved.wins === 'number') stats = saved;
  } catch (e) {}
  function saveStats() {
    try { localStorage.setItem('hangman-stats', JSON.stringify(stats)); } catch (e) {}
  }

  var state = { category: 'mixed', word: '', guessed: {}, wrong: 0, over: false, won: false, last: '' };

  function pick() {
    var pool = [];
    if (state.category === 'mixed') {
      Object.keys(WORDS).forEach(function (k) { pool = pool.concat(WORDS[k]); });
    } else {
      pool = WORDS[state.category];
    }
    var w;
    var tries = 0;
    do { w = pool[Math.floor(Math.random() * pool.length)]; tries++; } while (w === state.last && tries < 20);
    return w;
  }

  // Build static UI
  Object.keys(LABELS).forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = LABELS[k];
    b.dataset.cat = k;
    b.setAttribute('aria-pressed', k === state.category ? 'true' : 'false');
    b.addEventListener('click', function () {
      state.category = k;
      Array.prototype.forEach.call(el.cats.children, function (c) {
        c.setAttribute('aria-pressed', c.dataset.cat === k ? 'true' : 'false');
      });
      newGame();
    });
    el.cats.appendChild(b);
  });

  for (var i = 0; i < MAX_LIVES; i++) {
    var p = document.createElement('span');
    p.className = 'pip';
    el.pips.appendChild(p);
  }

  ROWS.forEach(function (row) {
    var r = document.createElement('div');
    r.className = 'row';
    row.split('').forEach(function (ch) {
      var k = document.createElement('button');
      k.type = 'button';
      k.className = 'key';
      k.textContent = ch;
      k.dataset.letter = ch;
      k.setAttribute('aria-label', 'Letter ' + ch.toUpperCase());
      k.addEventListener('click', function () { guess(ch); });
      r.appendChild(k);
    });
    el.keys.appendChild(r);
  });

  function newGame() {
    state.word = pick();
    state.last = state.word;
    state.guessed = {};
    state.wrong = 0;
    state.over = false;
    state.won = false;
    el.result.hidden = true;
    el.result.className = 'result';
    el.result.textContent = '';
    render();
    el.status.textContent = 'New word loaded. Pick a letter.';
  }

  function lettersLeft() {
    return state.word.split('').filter(function (c) { return !state.guessed[c]; });
  }

  function guess(ch) {
    if (state.over || state.guessed[ch]) return;
    state.guessed[ch] = true;
    if (state.word.indexOf(ch) === -1) {
      state.wrong++;
      el.status.textContent = ch.toUpperCase() + ' is not in the word.';
    } else {
      el.status.textContent = 'Yes. ' + ch.toUpperCase() + ' is in the word.';
    }
    checkEnd();
    render();
  }

  function hint() {
    if (state.over || state.wrong >= MAX_LIVES - 1) return;
    var left = lettersLeft();
    if (!left.length) return;
    var ch = left[Math.floor(Math.random() * left.length)];
    state.guessed[ch] = true;
    state.wrong++;
    el.status.textContent = 'Hint used. The word contains ' + ch.toUpperCase() + '.';
    checkEnd();
    render();
  }

  function checkEnd() {
    if (lettersLeft().length === 0) {
      state.over = true; state.won = true;
      stats.wins++; stats.streak++;
      if (stats.streak > stats.best) stats.best = stats.streak;
      saveStats();
      showResult();
    } else if (state.wrong >= MAX_LIVES) {
      state.over = true; state.won = false;
      stats.losses++; stats.streak = 0;
      saveStats();
      showResult();
    }
  }

  function showResult() {
    el.result.hidden = false;
    el.result.className = 'result ' + (state.won ? 'win' : 'lose');
    el.result.textContent = '';
    var h = document.createElement('strong');
    var p = document.createElement('p');
    if (state.won) {
      h.textContent = 'You saved him!';
      p.textContent = 'The word was "' + state.word + '". You missed ' + state.wrong + ' of ' + MAX_LIVES + ' lives. Win streak: ' + stats.streak + '.';
    } else {
      h.textContent = 'Out of lives.';
      p.textContent = 'The word was "' + state.word + '". Try another one.';
    }
    el.result.appendChild(h);
    el.result.appendChild(p);
    el.status.textContent = state.won ? 'You won.' : 'You lost.';
    setTimeout(function () { el.newBtn.focus(); }, 0);
  }

  function render() {
    // word slots
    el.word.textContent = '';
    state.word.split('').forEach(function (c) {
      var s = document.createElement('span');
      s.className = 'slot';
      if (state.guessed[c]) {
        s.textContent = c;
        if (state.over && state.won) s.classList.add('win');
      } else if (state.over) {
        s.textContent = c;
        s.classList.add('miss');
      }
      el.word.appendChild(s);
    });
    el.word.setAttribute('aria-label', state.over ? 'The word is ' + state.word : state.word.length + ' letter word, ' + (state.word.length - lettersLeft().length) + ' revealed');

    // keyboard
    Array.prototype.forEach.call(el.keys.querySelectorAll('.key'), function (k) {
      var ch = k.dataset.letter;
      var used = !!state.guessed[ch];
      var inWord = state.word.indexOf(ch) !== -1;
      k.className = 'key' + (used ? (inWord ? ' ok' : ' no') : (state.over ? ' off' : ''));
      k.disabled = used || state.over;
    });

    // gallows
    Array.prototype.forEach.call(parts, function (part, idx) {
      part.classList.toggle('on', idx < state.wrong);
    });
    el.gallows.classList.toggle('saved', state.over && state.won);

    // lives
    var left = MAX_LIVES - state.wrong;
    Array.prototype.forEach.call(el.pips.children, function (pip, idx) {
      pip.classList.toggle('lost', idx >= left);
    });
    el.livesText.textContent = left + (left === 1 ? ' life left' : ' lives left');

    // meta
    var catName = state.category === 'mixed' ? 'Mixed' : LABELS[state.category];
    el.metaCat.textContent = 'Category: ' + catName;
    el.metaLen.textContent = state.word.length + ' letters';

    // hint
    el.hintBtn.disabled = state.over || state.wrong >= MAX_LIVES - 1;

    // stats
    el.wins.textContent = stats.wins;
    el.losses.textContent = stats.losses;
    el.streak.textContent = stats.streak;
    el.best.textContent = stats.best;
  }

  el.hintBtn.addEventListener('click', hint);
  el.newBtn.addEventListener('click', newGame);

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-zA-Z]$/.test(e.key)) guess(e.key.toLowerCase());
  });

  newGame();
  el.status.textContent = 'Pick a letter to start.';
})();
</script>

</body>
</html>
